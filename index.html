<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Radios Novikov — Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0a0a0f;
    --accent: #00e5a0;
    --accent-glow: rgba(0, 229, 160, 0.15);
    --accent-soft: rgba(0, 229, 160, 0.08);
    --danger: #ff4757;
    --danger-soft: rgba(255, 71, 87, 0.1);
    --text: #e8e8f0;
    --text-dim: #6b6b80;
    --text-done: #4a4a60;
    --surface: #1c1c2e;
    --surface-light: #252540;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(0,229,160,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(100,60,255,0.03) 0%, transparent 50%);
    z-index: 0; pointer-events: none;
  }

  /* LOADING */
  .loading-screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-dark);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; z-index: 500; transition: opacity 0.3s;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  .loading-text { font-size: 14px; color: var(--text-dim); font-family: 'Space Mono', monospace; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.88);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; min-height: 56px;
  }
  .header-title-area { flex: 1; cursor: default; }
  .header-title-area.tappable {
    cursor: pointer; border-radius: 10px;
    margin: -6px -8px; padding: 6px 8px; transition: background 0.2s;
  }
  .header-title-area.tappable:active { background: rgba(255,255,255,0.05); }
  .header-main {
    font-weight: 700; font-size: 18px; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 8px;
  }
  .header-sub {
    font-size: 11px; color: var(--text-dim);
    font-family: 'Space Mono', monospace; letter-spacing: 1px;
    text-transform: uppercase; margin-top: 2px;
  }
  .header-room-icon { font-size: 22px; }
  .header-counter {
    font-family: 'Space Mono', monospace; font-size: 13px;
    color: var(--text-dim); display: none; flex-shrink: 0;
  }
  .header-counter.visible { display: block; }
  .header-counter .hc-done { color: var(--accent); }

  /* MODE SWITCHER */
  .mode-switcher {
    position: relative;
    margin: 0 -16px;
    padding: 0 16px;
    overflow: hidden;
    touch-action: pan-x;
    user-select: none; -webkit-user-select: none;
  }
  .mode-tabs {
    display: flex; gap: 0;
    position: relative;
  }
  .mode-tab {
    flex: 1;
    padding: 14px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    z-index: 1;
  }
  .mode-tab-icon { font-size: 20px; margin-bottom: 4px; }
  .mode-tab-name {
    font-size: 13px; font-weight: 600; letter-spacing: -0.2px;
    color: var(--text-dim); transition: color 0.25s;
  }
  .mode-tab-desc {
    font-size: 10px; color: var(--text-dim); opacity: 0.5;
    font-family: 'Space Mono', monospace; letter-spacing: 0.5px;
    text-transform: uppercase; margin-top: 2px;
    transition: opacity 0.25s;
  }
  .mode-tab.active .mode-tab-name { color: var(--accent); }
  .mode-tab.active .mode-tab-desc { opacity: 0.8; }
  .mode-tab:active { transform: scale(0.97); }

  .mode-indicator {
    position: absolute; bottom: 0; height: 3px;
    background: var(--accent); border-radius: 3px;
    transition: left 0.3s cubic-bezier(.4,0,.2,1), width 0.3s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .mode-swipe-hint {
    text-align: center; padding: 6px 0 0;
    font-size: 10px; color: var(--text-dim); opacity: 0.4;
    font-family: 'Space Mono', monospace; letter-spacing: 1px;
  }

  /* ROOM MENU */
  .room-menu { padding: 16px 16px 100px; position: relative; z-index: 1; }
  .app-brand { text-align: center; padding: 16px 0 20px; }
  .app-brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -1px; margin-bottom: 4px; }
  .app-brand h1 .brand-accent { color: var(--accent); }
  .app-brand p {
    font-size: 12px; text-transform: uppercase; letter-spacing: 3px;
    color: var(--text-dim); font-family: 'Space Mono', monospace;
  }
  .section-label {
    font-size: 13px; text-transform: uppercase; letter-spacing: 2.5px;
    color: var(--text-dim); margin-bottom: 12px; font-weight: 600; padding-left: 4px;
  }
  .room-grid { display: flex; flex-direction: column; gap: 10px; }
  .room-card {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px; padding: 16px 16px; cursor: pointer;
    transition: all 0.25s cubic-bezier(.4,0,.2,1); position: relative; overflow: hidden;
  }
  .room-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .room-card:active { transform: scale(0.98); background: var(--surface-light); }
  .room-card.all-done { border-color: rgba(0,229,160,0.2); }
  .room-card.all-done::before { opacity: 1; }
  .room-card-inner { display: flex; align-items: center; gap: 14px; }
  .room-icon { font-size: 26px; flex-shrink: 0; }
  .room-info { flex: 1; min-width: 0; }
  .room-name { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
  .room-status { font-size: 12px; font-family: 'Space Mono', monospace; color: var(--text-dim); }
  .room-status .done-count { color: var(--accent); }
  .room-progress { margin-top: 8px; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .room-progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .room-arrow { color: var(--text-dim); font-size: 18px; flex-shrink: 0; opacity: 0.4; }

  /* TASK VIEW */
  .task-view { display: none; padding: 12px 16px 100px; position: relative; z-index: 1; }
  .task-view.active { display: block; }
  .room-menu.hidden { display: none; }
  .room-progress-top { height: 4px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
  .room-progress-top-bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s ease; }
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-btn {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 18px 18px; cursor: pointer;
    transition: all 0.2s cubic-bezier(.4,0,.2,1);
    user-select: none; -webkit-user-select: none;
    font-family: 'Outfit', sans-serif; color: var(--text); text-align: left;
    outline: none; -webkit-appearance: none;
  }
  .task-btn:active { transform: scale(0.98); }
  .task-btn.done { background: rgba(0,229,160,0.07); border-color: rgba(0,229,160,0.18); }
  .task-status-icon {
    width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; transition: all 0.2s;
    background: rgba(255,255,255,0.04); color: var(--text-dim);
    border: 1.5px solid rgba(255,255,255,0.1);
  }
  .task-btn.done .task-status-icon {
    background: var(--accent); border-color: var(--accent); color: var(--bg-dark);
    box-shadow: 0 0 14px var(--accent-glow);
  }
  .task-btn-label { font-size: 16px; font-weight: 500; transition: all 0.2s; line-height: 1.3; flex: 1; }
  .task-btn.done .task-btn-label {
    color: var(--text-done); text-decoration: line-through;
    text-decoration-color: rgba(255,255,255,0.08);
  }

  /* BANNERS */
  .completion-banner, .all-done-banner {
    display: none; text-align: center; padding: 24px 20px;
    background: rgba(0,229,160,0.06); border: 1px solid rgba(0,229,160,0.15);
    border-radius: 18px; margin-top: 12px; animation: fadeInUp 0.4s ease;
    cursor: pointer; transition: all 0.2s;
  }
  .completion-banner:active, .all-done-banner:active { transform: scale(0.98); }
  .completion-banner.visible, .all-done-banner.visible { display: block; }
  .cb-icon, .adb-icon { font-size: 36px; margin-bottom: 6px; }
  .cb-title, .adb-title { font-size: 18px; font-weight: 700; margin-bottom: 3px; }
  .cb-sub, .adb-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
  .cb-next {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: var(--bg-dark);
    padding: 12px 24px; border-radius: 12px;
    font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700;
    border: none; cursor: pointer; -webkit-appearance: none; outline: none; transition: all 0.2s;
  }
  .cb-next:active { transform: scale(0.95); }
  .cb-next .cb-next-icon { font-size: 18px; }
  .adb-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-light); color: var(--text);
    padding: 12px 24px; border-radius: 12px;
    font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer; -webkit-appearance: none; outline: none; transition: all 0.2s;
  }
  .adb-btn:active { transform: scale(0.95); }

  /* BOTTOM BAR */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(10,10,15,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.05); z-index: 50;
    display: flex; justify-content: center; gap: 10px;
  }
  .bottom-btn {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-dim); padding: 10px 18px; border-radius: 12px;
    font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; -webkit-appearance: none; outline: none;
  }
  .bottom-btn:active { transform: scale(0.95); background: var(--surface-light); }
  .bottom-btn.danger { color: var(--danger); }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 200; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-overlay.visible { display: flex; }
  .modal-box {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 28px 24px; max-width: 320px; width: 100%;
    text-align: center; animation: fadeInUp 0.25s ease;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .modal-text { font-size: 14px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.4; }
  .modal-buttons { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; -webkit-appearance: none; outline: none;
  }
  .modal-btn:active { transform: scale(0.95); }
  .modal-btn-cancel { background: var(--surface-light); color: var(--text); }
  .modal-btn-confirm { background: var(--danger); color: white; }

  /* ERROR */
  .error-banner {
    display: none; padding: 12px 16px; margin: 0 0 12px;
    background: var(--danger-soft); border: 1px solid rgba(255,71,87,0.2);
    border-radius: 12px; font-size: 13px; color: var(--danger);
    text-align: center; z-index: 1; position: relative;
  }
  .error-banner.visible { display: block; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .room-card { animation: fadeInUp 0.4s ease both; }
  .room-card:nth-child(2) { animation-delay: 0.03s; }
  .room-card:nth-child(3) { animation-delay: 0.06s; }
  .room-card:nth-child(4) { animation-delay: 0.09s; }
  .room-card:nth-child(5) { animation-delay: 0.12s; }
  .room-card:nth-child(6) { animation-delay: 0.15s; }
  .room-card:nth-child(7) { animation-delay: 0.18s; }
  .room-card:nth-child(8) { animation-delay: 0.21s; }
  .room-card:nth-child(9) { animation-delay: 0.24s; }
  .task-btn { animation: fadeInUp 0.3s ease both; }
  .task-btn:nth-child(2) { animation-delay: 0.02s; }
  .task-btn:nth-child(3) { animation-delay: 0.04s; }
  .task-btn:nth-child(4) { animation-delay: 0.06s; }
  .task-btn:nth-child(5) { animation-delay: 0.08s; }
  .task-btn:nth-child(6) { animation-delay: 0.1s; }
  .task-btn:nth-child(7) { animation-delay: 0.12s; }
  .task-btn:nth-child(8) { animation-delay: 0.14s; }
  .task-btn:nth-child(9) { animation-delay: 0.16s; }
  .task-btn:nth-child(10) { animation-delay: 0.18s; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Carregant...</div>
</div>

<div class="header">
  <div class="header-title-area" id="headerTitleArea">
    <div class="header-main" id="headerMain">Radios Novikov</div>
    <div class="header-sub" id="headerSub">escape room setup</div>
  </div>
  <div class="header-counter" id="headerCounter"></div>
</div>

<div class="room-menu" id="roomMenu">
  <div class="app-brand">
    <h1>Radios <span class="brand-accent">Novikov</span></h1>
    <p>Setup checklist</p>
  </div>

  <div class="mode-switcher" id="modeSwitcher">
    <div class="mode-tabs" id="modeTabs"></div>
    <div class="mode-indicator" id="modeIndicator"></div>
  </div>
  <div class="mode-swipe-hint">← swipe per canviar →</div>

  <div style="height: 16px;"></div>
  <div class="error-banner" id="errorBanner">No s'ha pogut carregar tasks.json — usant dades locals</div>
  <div class="section-label" id="sectionLabel">Sales</div>
  <div class="room-grid" id="roomGrid"></div>
</div>

<div class="task-view" id="taskView">
  <div class="room-progress-top">
    <div class="room-progress-top-bar" id="topProgressBar"></div>
  </div>
  <div class="task-list" id="taskList"></div>
  <div class="completion-banner" id="completionBanner">
    <div class="cb-icon">🎉</div>
    <div class="cb-title">Sala preparada!</div>
    <div class="cb-sub">Totes les tasques completades</div>
    <button class="cb-next" id="nextRoomBtn"><span class="cb-next-icon">→</span> <span id="nextRoomLabel">Següent sala</span></button>
  </div>
  <div class="all-done-banner" id="allDoneBanner">
    <div class="adb-icon">🏆</div>
    <div class="adb-title">Tot preparat!</div>
    <div class="adb-sub">Totes les sales estan llestes</div>
    <button class="adb-btn" id="backToMenuBtn">← Tornar al menú</button>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <button class="bottom-btn" id="resetCurrentBtn" style="display:none;">↻ Reset sala</button>
  <button class="bottom-btn danger" id="resetAllBtn">↻ Reset tot</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Confirmar</div>
    <div class="modal-text" id="modalText">Estàs segur?</div>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-cancel" id="modalCancel">Cancel·lar</button>
      <button class="modal-btn modal-btn-confirm" id="modalConfirm">Reset</button>
    </div>
  </div>
</div>

<script>
var modes = [];
var currentModeIdx = 0;
var checkState = {};
var currentRoom = null;
var pendingAction = null;

// --- Persistence ---
function saveChecks() { try { localStorage.setItem('rn_checks_v2', JSON.stringify(checkState)); } catch(e) {} }
function loadChecks() { try { var s = localStorage.getItem('rn_checks_v2'); if (s) checkState = JSON.parse(s); } catch(e) {} }
function stateKey(modeId, roomId) { return modeId + '::' + roomId; }
function getChecks(modeId, roomId) { var k = stateKey(modeId, roomId); if (!checkState[k]) checkState[k] = {}; return checkState[k]; }
function getDoneCount(mode, room) { var c = getChecks(mode.id, room.id); return room.tasks.filter(function(_,i){ return c[i]===true; }).length; }
function isRoomComplete(mode, room) { return getDoneCount(mode, room) === room.tasks.length && room.tasks.length > 0; }

function currentMode() { return modes[currentModeIdx]; }
function currentRooms() { var m = currentMode(); return m ? m.rooms : []; }

function getNextPendingRoom() {
  var rm = currentRooms();
  if (!currentRoom || rm.length <= 1) return null;
  var currentIdx = rm.indexOf(currentRoom);
  for (var offset = 1; offset < rm.length; offset++) {
    var idx = (currentIdx + offset) % rm.length;
    if (!isRoomComplete(currentMode(), rm[idx])) return rm[idx];
  }
  return null;
}

// --- Hash ---
function hashModes(modeList) {
  return modeList.map(function(m) {
    return m.id + ':{' + m.rooms.map(function(r) { return r.id + ':' + r.tasks.join('|'); }).join(';;') + '}';
  }).join('|||');
}

// --- Load tasks.json ---
function loadTasks(callback) {
  fetch('tasks.json?v=' + Date.now())
    .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(function(data) {
      if (data && data.modes && Array.isArray(data.modes)) {
        modes = data.modes;
      } else if (data && data.rooms && Array.isArray(data.rooms)) {
        // Backward compat: single-mode file
        modes = [{ id: 'session_setup', name: 'Session Setup', icon: '🔄', description: 'Entre sessions', rooms: data.rooms }];
      } else {
        throw new Error('Invalid format');
      }
      var newHash = hashModes(modes);
      var oldHash = '';
      try { oldHash = localStorage.getItem('rn_tasks_hash_v2') || ''; } catch(e) {}
      if (oldHash && newHash !== oldHash) { checkState = {}; saveChecks(); }
      try { localStorage.setItem('rn_tasks_hash_v2', newHash); } catch(e) {}
      document.getElementById('errorBanner').classList.remove('visible');
      callback();
    })
    .catch(function(err) {
      console.warn('Could not load tasks.json:', err);
      try { var cached = localStorage.getItem('rn_modes_cache'); if (cached) modes = JSON.parse(cached); } catch(e) {}
      if (modes.length === 0) {
        modes = [{ id: 'session_setup', name: 'Session Setup', icon: '🔄', description: 'Entre sessions', rooms: [
          { id: 'botiga', name: 'Botiga', icon: '🏪', tasks: ['Calibrar porta', 'Encendre TV groga'] }
        ]}];
      }
      document.getElementById('errorBanner').classList.add('visible');
      callback();
    });
}

// --- Mode Switcher ---
var swipeStartX = 0;
var swipeCurrentX = 0;
var isSwiping = false;

function renderModeTabs() {
  var container = document.getElementById('modeTabs');
  container.innerHTML = '';
  modes.forEach(function(mode, i) {
    var tab = document.createElement('div');
    tab.className = 'mode-tab' + (i === currentModeIdx ? ' active' : '');
    tab.setAttribute('data-mode-idx', i);
    tab.innerHTML = '<div class="mode-tab-icon">' + mode.icon + '</div>' +
      '<div class="mode-tab-name">' + mode.name + '</div>' +
      '<div class="mode-tab-desc">' + (mode.description || '') + '</div>';
    container.appendChild(tab);
  });
  updateModeIndicator();
}

function updateModeIndicator() {
  var tabs = document.querySelectorAll('.mode-tab');
  var indicator = document.getElementById('modeIndicator');
  if (tabs.length === 0) { indicator.style.display = 'none'; return; }
  var tab = tabs[currentModeIdx];
  indicator.style.left = tab.offsetLeft + 'px';
  indicator.style.width = tab.offsetWidth + 'px';
  indicator.style.display = 'block';
}

function switchMode(idx) {
  if (idx < 0 || idx >= modes.length || idx === currentModeIdx) return;
  currentModeIdx = idx;
  var tabs = document.querySelectorAll('.mode-tab');
  tabs.forEach(function(t, i) { t.classList.toggle('active', i === idx); });
  updateModeIndicator();
  renderRooms();
}

document.getElementById('modeTabs').addEventListener('click', function(e) {
  var tab = e.target.closest('.mode-tab');
  if (tab) switchMode(parseInt(tab.getAttribute('data-mode-idx')));
});

// Swipe on mode switcher
document.getElementById('modeSwitcher').addEventListener('touchstart', function(e) {
  swipeStartX = e.touches[0].clientX;
  swipeCurrentX = swipeStartX;
  isSwiping = true;
}, { passive: true });

document.getElementById('modeSwitcher').addEventListener('touchmove', function(e) {
  if (!isSwiping) return;
  swipeCurrentX = e.touches[0].clientX;
}, { passive: true });

document.getElementById('modeSwitcher').addEventListener('touchend', function() {
  if (!isSwiping) return;
  isSwiping = false;
  var dx = swipeCurrentX - swipeStartX;
  if (dx < -50) switchMode(currentModeIdx + 1);
  else if (dx > 50) switchMode(currentModeIdx - 1);
});

// Also allow swiping on the room list area
document.getElementById('roomMenu').addEventListener('touchstart', function(e) {
  swipeStartX = e.touches[0].clientX;
  swipeCurrentX = swipeStartX;
  isSwiping = true;
}, { passive: true });

document.getElementById('roomMenu').addEventListener('touchmove', function(e) {
  if (!isSwiping) return;
  swipeCurrentX = e.touches[0].clientX;
}, { passive: true });

document.getElementById('roomMenu').addEventListener('touchend', function() {
  if (!isSwiping) return;
  isSwiping = false;
  var dx = swipeCurrentX - swipeStartX;
  if (Math.abs(dx) > 60) {
    if (dx < -60) switchMode(currentModeIdx + 1);
    else if (dx > 60) switchMode(currentModeIdx - 1);
  }
});

// --- Modal ---
function showModal(title, text, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').classList.add('visible');
  pendingAction = onConfirm;
}
function hideModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
  pendingAction = null;
}
document.getElementById('modalCancel').addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); hideModal(); });
document.getElementById('modalConfirm').addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); if (pendingAction) pendingAction(); hideModal(); });
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) hideModal(); });

// --- Room Grid ---
function renderRooms() {
  var mode = currentMode();
  if (!mode) return;
  var rm = mode.rooms;
  var grid = document.getElementById('roomGrid');
  grid.innerHTML = '';
  rm.forEach(function(room) {
    var done = getDoneCount(mode, room);
    var total = room.tasks.length;
    var allDone = done === total && total > 0;
    var card = document.createElement('div');
    card.className = 'room-card' + (allDone ? ' all-done' : '');
    card.setAttribute('data-room', room.id);
    card.innerHTML = '<div class="room-card-inner">' +
      '<span class="room-icon">' + room.icon + '</span>' +
      '<div class="room-info">' +
        '<div class="room-name">' + room.name + '</div>' +
        '<div class="room-status"><span class="done-count">' + done + '</span> / ' + total + '</div>' +
        '<div class="room-progress"><div class="room-progress-bar" style="width:' + (total?(done/total)*100:0) + '%"></div></div>' +
      '</div>' +
      '<span class="room-arrow">›</span>' +
    '</div>';
    grid.appendChild(card);
  });
}

document.getElementById('roomGrid').addEventListener('click', function(e) {
  var card = e.target.closest('.room-card');
  if (card) {
    var roomId = card.getAttribute('data-room');
    if (roomId) openRoom(roomId);
  }
});

// --- Navigation ---
function openRoom(roomId) {
  var rm = currentRooms();
  currentRoom = rm.find(function(r){ return r.id === roomId; });
  document.getElementById('roomMenu').classList.add('hidden');
  document.getElementById('taskView').classList.add('active');
  document.getElementById('headerCounter').classList.add('visible');
  document.getElementById('resetCurrentBtn').style.display = '';
  var area = document.getElementById('headerTitleArea');
  area.classList.add('tappable');
  document.getElementById('headerMain').innerHTML = '<span class="header-room-icon">' + currentRoom.icon + '</span> ' + currentRoom.name;
  document.getElementById('headerSub').innerHTML = '← Tornar a sales';
  window.scrollTo(0, 0);
  renderTasks();
}

function goBack() {
  document.getElementById('roomMenu').classList.remove('hidden');
  document.getElementById('taskView').classList.remove('active');
  document.getElementById('headerCounter').classList.remove('visible');
  document.getElementById('resetCurrentBtn').style.display = 'none';
  var area = document.getElementById('headerTitleArea');
  area.classList.remove('tappable');
  document.getElementById('headerMain').textContent = 'Radios Novikov';
  document.getElementById('headerSub').textContent = 'escape room setup';
  currentRoom = null;
  renderRooms();
}

document.getElementById('headerTitleArea').addEventListener('click', function() {
  if (this.classList.contains('tappable')) goBack();
});

document.getElementById('nextRoomBtn').addEventListener('click', function(e) {
  e.preventDefault(); e.stopPropagation();
  var next = getNextPendingRoom();
  if (next) openRoom(next.id);
});

document.getElementById('backToMenuBtn').addEventListener('click', function(e) {
  e.preventDefault(); e.stopPropagation();
  goBack();
});

// --- Task List ---
function renderTasks() {
  if (!currentRoom) return;
  var mode = currentMode();
  var c = getChecks(mode.id, currentRoom.id);
  var total = currentRoom.tasks.length;
  var done = getDoneCount(mode, currentRoom);
  document.getElementById('headerCounter').innerHTML = '<span class="hc-done">' + done + '</span>/' + total;
  document.getElementById('topProgressBar').style.width = (total?(done/total)*100:0) + '%';
  var list = document.getElementById('taskList');
  list.innerHTML = '';
  currentRoom.tasks.forEach(function(task, i) {
    var isDone = c[i] === true;
    var btn = document.createElement('button');
    btn.className = 'task-btn' + (isDone ? ' done' : '');
    btn.setAttribute('data-index', i);
    btn.innerHTML = '<div class="task-status-icon">' + (isDone ? '✓' : (i+1)) + '</div><div class="task-btn-label">' + task + '</div>';
    list.appendChild(btn);
  });
  var completionBanner = document.getElementById('completionBanner');
  var allDoneBanner = document.getElementById('allDoneBanner');
  completionBanner.classList.remove('visible');
  allDoneBanner.classList.remove('visible');
  if (done === total && total > 0) {
    var nextRoom = getNextPendingRoom();
    if (nextRoom) {
      document.getElementById('nextRoomLabel').textContent = nextRoom.icon + ' ' + nextRoom.name;
      completionBanner.classList.add('visible');
    } else {
      allDoneBanner.classList.add('visible');
    }
  }
}

document.getElementById('taskList').addEventListener('click', function(e) {
  var btn = e.target.closest('.task-btn');
  if (btn) {
    var idx = parseInt(btn.getAttribute('data-index'));
    if (!isNaN(idx)) toggleTask(idx);
  }
});

function toggleTask(i) {
  var mode = currentMode();
  var c = getChecks(mode.id, currentRoom.id);
  c[i] = !c[i];
  if (!c[i]) delete c[i];
  saveChecks();
  renderTasks();
}

// --- Reset ---
document.getElementById('resetCurrentBtn').addEventListener('click', function(e) {
  e.preventDefault(); e.stopPropagation();
  if (currentRoom) {
    showModal(
      'Reset ' + currentRoom.name + '?',
      "Es desmarcaran totes les tasques d'aquesta sala.",
      function() {
        var k = stateKey(currentMode().id, currentRoom.id);
        checkState[k] = {};
        saveChecks(); renderTasks();
      }
    );
  }
});

document.getElementById('resetAllBtn').addEventListener('click', function(e) {
  e.preventDefault(); e.stopPropagation();
  var mode = currentMode();
  showModal(
    'Reset ' + mode.name + '?',
    'Es desmarcaran totes les tasques de totes les sales en aquest mode.',
    function() {
      mode.rooms.forEach(function(r) { var k = stateKey(mode.id, r.id); checkState[k] = {}; });
      saveChecks();
      if (currentRoom) renderTasks(); else renderRooms();
    }
  );
});

// --- Init ---
loadChecks();
loadTasks(function() {
  try { localStorage.setItem('rn_modes_cache', JSON.stringify(modes)); } catch(e) {}
  renderModeTabs();
  renderRooms();
  setTimeout(function() {
    document.getElementById('loadingScreen').classList.add('hidden');
  }, 300);
});

// Handle resize for indicator
window.addEventListener('resize', updateModeIndicator);
</script>
</body>
